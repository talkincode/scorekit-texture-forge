[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scorekit-texture-forge"
version = "0.1.0"
description = "Neural sound-texture foundry for scorekit powered by Magenta RealTime 2 (MRT2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "talkincode", email = "dev@talkincode.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mrt2 = [
    "magenta-rt>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
texture-forge = "texture_forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["texture_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
